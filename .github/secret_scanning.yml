# GitHub secret scanning — path allowlist.
#
# tests/unit/test_sandbox.py embeds credentials inside a proxy URL as a NEGATIVE
# security-test fixture: ContainerCommand must REJECT proxy URLs that carry
# credentials (see aios_kernel/modules/sandbox.py `_validate_proxy`). This is the
# server-side counterpart to the local TruffleHog allowlist (.trufflehog-exclude);
# everything else remains scanned and fails closed on any finding.
paths-ignore:
  - 'tests/unit/test_sandbox.py'